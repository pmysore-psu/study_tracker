<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Heatmap Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Use the exact same Firebase configuration credentials here
        const firebaseConfig = {
        apiKey: "AIzaSyAEUndKc0W1M_SPNeIxUU65m13EKh67U3I",
        authDomain: "study-tracker-59fe0.firebaseapp.com",
        projectId: "study-tracker-59fe0",
        storageBucket: "study-tracker-59fe0.firebasestorage.app",
        messagingSenderId: "1093428015301",
        appId: "1:1093428015301:web:bce9457a6cb534177cc0ac"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadWidgetData() {
            const dailyData = {};
            try {
                const querySnapshot = await getDocs(collection(db, "studyLogs"));
                querySnapshot.forEach((doc) => {
                    dailyData[doc.id] = doc.data().minutes;
                });
                renderWidgetHeatmap(dailyData);
            } catch (err) {
                console.error("Error loading widget data:", err);
            }
        }

        function renderWidgetHeatmap(dailyData) {
            const grid = document.getElementById('widgetGrid');
            grid.innerHTML = '';

            const today = new Date();
            for (let i = 119; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                const minutes = dailyData[dateStr] || 0;

                const cell = document.createElement('div');
                cell.className = "w-3 h-3 rounded-sm";
                cell.title = `${dateStr}: ${minutes} mins`;

                if (minutes === 0) cell.classList.add('bg-slate-800');
                else if (minutes < 30) cell.classList.add('bg-indigo-950');
                else if (minutes < 90) cell.classList.add('bg-indigo-700');
                else cell.classList.add('bg-indigo-500');

                grid.appendChild(cell);
            }
        }

        window.addEventListener('DOMContentLoaded', loadWidgetData);
    </script>
</head>
<body class="bg-transparent flex justify-center items-center p-2">
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
        <h3 class="text-xs font-semibold text-slate-400 mb-2">My Study Progress</h3>
        <div id="widgetGrid" class="grid grid-flow-col grid-rows-7 gap-1"></div>
    </div>
</body>
</html>
